# formalization.yaml v0.4, one file for the three registry entries of this repository: comparator.json (Challenge.lean),
# comparator-main-ch0.json (ChallengeMainCh0.lean) and comparator-ch0.json (ChallengeCh0.lean).
version: "v0.4"

project:
  name: "Resolution of Singularities of an Algebraic Variety Over a Field of Characteristic Zero"
  description: >-
    Heisuke Hironaka's 1964 papers 'Resolution of singularities of an algebraic variety over a field of characteristic zero I,II' were seminal achievements in the history of algebraic geometry. They had inestimable impact on a broad range of research areas in mathematics including geometry, topology, number theory, differential equations, and mathematical physics. The achievement was recognised by a Fields medal awarded to Hironaka in 1970. The papers constitute a veritable tour de force contained in 217 densely-packed pages. The algebraic and combinatorial complexity of the papers is daunting, especially towards the later portions, and have led to a significant level of persistent incomprehension even on the part of domain experts. Because more transparent proofs of the same result appeared in the 1990s, the question of understanding the original papers in detail has become somewhat forgotten. In the associated repository, we have formalised Hironaka's argument in full, modulo results he cites. We have also compiled an erratum, and included complementary arguments for a few portions of the paper that had non-trivial gaps. In a separate publication, we will give some of the narrative background, the interesting story of the mathematical community's tortuous efforts to understand these great works. The size of the formalization has forced us to split this work over three Palomar entries, one for each comparator configuration. The related entries can be found at PALOMAR-2026-11-03-000021 and PALOMAR-2026-11-04-000004 respectively.
  authors:
    - "Daattavya Aggarwal"
    - "Minhyong Kim"
    - "Oisin Kim"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Daattavya Aggarwal"   # one or more of the authors

classification:
  arxiv: ["math.AG"]
  msc2020: ["14E15", "14B05", "14E05", "13H05"]

