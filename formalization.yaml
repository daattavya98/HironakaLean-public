status:
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Hironaka.allFundamentalTheorems_printedRange"
      comparator_config: "comparator.json"
      literature_dependencies: &HironakaCitedResults
        - &IsHironakaBaseIsClosedSingularLocus
          statement: >-
            Property (iii) of the class 𝔅 (Hironaka I, p. 161): for S in 𝔅, “For every S-algebra of finite type A, the
            singular locus of Spec(A) is closed (with reference to Zariski topology).”
            (Hironaka.Cited.IsHironakaBaseIsClosedSingularLocus)
          source: >-
            Nagata, A Jacobian criterion of simple points; Nagata, Local Rings, §46, Ch. VII; Nagata, On the closedness of
            singular loci, Publ. Math. IHES 2 (1959), Theorem 1 (Hironaka I, footnote 30, p. 161)
        - &MonoidalTransformationExistsIsProper
          statement: >-
            The monoidal transformation of an algebraic scheme V with center a subscheme B exists: “The existence can be
            proved by taking as V′ the projective scheme Proj(S(I)) over V” (Hironaka I, p. 166); and it is proper (“all
            the morphisms fᵢ are proper”, Hironaka I, p. 174; Hironaka II, p. 278). Assumed for every scheme, with
            properness when the scheme is locally noetherian. (Hironaka.Cited.MonoidalTransformationExistsIsProper)
          source: >-
            Éléments de géométrie algébrique II, §3 (Hironaka I, footnote 33, p. 166: “cf. §3, Ch. II, of Grothendieck,
            [6]”)
        - &CurveFiniteIntegralClosure
          statement: >-
            For a complete noetherian local domain S, “the derived normal ring of S in its field of quotients is an
            S-module of finite type” (Hironaka II, p. 218). (Hironaka.Cited.CurveFiniteIntegralClosure)
          source: >-
            The theory of local rings: Nagata, Local Rings (Hironaka I, footnote 3, p. 116)
        - &ExistsFlatIsLocalHomAdicCompletionOfFlat
          statement: >-
            A flat local homomorphism R → R′ of noetherian local rings induces a flat local homomorphism R̂ → R̂′ of the
            completions, compatible with it. (Hironaka.Cited.ExistsFlatIsLocalHomAdicCompletionOfFlat)
          source: >-
            The theory of local rings: Zariski–Samuel, Commutative Algebra II, Ch. VII–VIII;
            Nagata, Local Rings (Hironaka I, footnote 3, p. 116)
        - &ExistsHilbertSamuelPoly
          statement: >-
            “If A is a noetherian local ring and m is the maximal ideal of A, then we have a polynomial H(p) with rational
            coefficients such that for all sufficiently large integers p the value H(p) of the polynomial is equal to the
            sum of ranks of the (A/m)-modules grⁱ_m(A) with 0 ≦ i ≦ p. The degree of the polynomial is equal to the Krull
            dimension of A, say d, and the coefficient of the term of degree d of H(p) is of the form e(A)/d! where e(A)
            is a positive integer.” (Hironaka I, p. 133) (Hironaka.Cited.ExistsHilbertSamuelPoly)
          source: >-
            Stated without proof or reference; The theory of local rings: Zariski–Samuel, Commutative Algebra II,
            Ch. VII–VIII; Nagata, Local Rings (Hironaka I, footnote 3, p. 116)
        - &ExistsResidueCompEqIdOfIsAdicCompleteOfRingCharEq
          statement: >-
            The part of Cohen's structure theorem used: a complete noetherian local ring with the same characteristic as
            its residue field has a coefficient field. The paper uses it for complete regular local rings: “R is a formal power series ring over a field, by Cohen's structure theorem” (Hironaka II, p. 258; also pp. 269, 297).
            (Hironaka.Cited.ExistsResidueCompEqIdOfIsAdicCompleteOfRingCharEq)
          source: >-
            Cohen, On the structure and ideal theory of complete local rings (“Cohen's structure theorem”, Hironaka II,
            pp. 258, 297)
        - &ExistsSurjectiveMvPowerSeriesOfIsAdicComplete
          statement: >-
            A complete noetherian local ring S whose residue field has characteristic zero “is a homomorphic image of a
            formal power series ring over a field of characteristic zero” (Hironaka I, footnote 30, p. 161; footnote 37,
            p. 175). (Hironaka.Cited.ExistsSurjectiveMvPowerSeriesOfIsAdicComplete)
          source: >-
            Cohen, On the structure and ideal theory of complete local rings; stated without reference in Hironaka I,
            footnotes 30 and 37
        - &ExistsSurjectiveOfIsRegularLocalRingOfIsAdicComplete
          statement: >-
            Every complete noetherian local ring O “is a quotient ring R/J of a complete regular local ring R by an ideal
            J in R” (Hironaka I, p. 200). (Hironaka.Cited.ExistsSurjectiveOfIsRegularLocalRingOfIsAdicComplete)
          source: >-
            Cohen, On the structure and ideal theory of complete local rings (“By Cohen's structure theorem of a complete
            local ring”, Hironaka I, p. 200)
        - &FiniteIntegralClosureOfEssFiniteType
          statement: >-
            For a complete noetherian local ring S and a domain A essentially of finite type over S, the integral closure
            of A in its field of quotients is a finite A-module. (Hironaka.Cited.FiniteIntegralClosureOfEssFiniteType)
          source: >-
            Nagata, Local Rings (Hironaka I, footnote 3, p. 116). The paper recalls the complete case: “this condition is
            satisfied by every complete noetherian local ring without nilpotent elements” (Hironaka II, footnote 10,
            p. 243); the case used on p. 305 of Hironaka II, for rings of monoidal transforms of Ŝ_t, is not stated in
            the paper
        - &IsClosedComplRegularLocusOfFiniteType
          statement: >-
            For Ā = A/N of finite type over the perfect residue field of R, “the singular locus of Spec(Ā) is a nowhere
            dense closed subset” (Hironaka II, p. 260). Assumed in the form: for a perfect field k and every k-algebra of
            finite type B, the singular locus of Spec B is closed. (Hironaka.Cited.IsClosedComplRegularLocusOfFiniteType)
          source: >-
            Zariski, The concept of a simple point of an abstract algebraic variety (1947) (Hironaka II, footnote 12,
            p. 260: “cf. Zariski [29]”)
        - &IsRegularLocalRingLocalizationIffRankJacobianEqHeight
          statement: >-
            The jacobian criterion (Hironaka I, footnote 30, p. 161: “the jacobian criterion for simplicity”), for a polynomial ring
            T = k⟦t₁,…,t_n⟧[x₁,…,x_m] over a formal power series ring over a field k of characteristic zero: for prime
            ideals 𝔭 ⊆ 𝔮 of T and generators f₁,…,f_r of 𝔭, the localization of T/𝔭 at 𝔮 is regular if and only if
            rank(J(f₁,…,f_r) modulo 𝔮) = rank 𝔭. (Hironaka.Cited.IsRegularLocalRingLocalizationIffRankJacobianEqHeight)
          source: >-
            Nagata, A Jacobian criterion of simple points; Nagata, Local Rings, §46, Ch. VII (Hironaka I, footnote 30,
            p. 161)
        - &IsRegularLocalRingLocalizationOfIsRegularLocalRing
          statement: >-
            For a regular local ring R and a prime ideal P, R_P is regular: “a localization of a regular local ring by
            any prime ideal is regular” (Hironaka II, footnote 9, p. 243).
            (Hironaka.Cited.IsRegularLocalRingLocalizationOfIsRegularLocalRing)
          source: >-
            J.-P. Serre, Sur la dimension homologique des anneaux et des modules noethériens, Proc. Int. Symp.
            Tokyo–Nikko 1955 (Hironaka II, footnote 9, p. 243)
        - &IsRegularLocalRingOfFlatOfIsRegularLocalRing
          statement: >-
            If R → R′ is a flat local homomorphism of noetherian local rings and R′ is regular, then R is regular.
            (Hironaka.Cited.IsRegularLocalRingOfFlatOfIsRegularLocalRing)
          source: >-
            The theory of local rings: Zariski–Samuel, Commutative Algebra II, Ch. VII–VIII;
            Nagata, Local Rings (Hironaka I, footnote 3, p. 116)
        - &IsSeparableFieldExtensionIff
          statement: >-
            “An extension of fields, k′ over k, is separable if and only if every k-subfield of finite type of k′ is
            separably algebraic over a purely transcendental extension of k in k′” (Hironaka II, p. 223), separable in
            the sense of pp. 211–212. (Hironaka.Cited.IsSeparableFieldExtensionIff)
          source: >-
            MacLane, Modular fields I, Duke Math. J. 5 (1939); Nagata, Local Rings, §39, Ch. IV (Hironaka II, footnote 4, p. 223)
        - &RingKrullDimAdicCompletionQuotientEq
          statement: >-
            For a noetherian local ring R and an ideal Q, dim(R̂/QR̂) = dim(R/Q); used in “We can assume that
            dim(R̂/Q̂) = dim(R/Q)” (Hironaka II, p. 261). (Hironaka.Cited.RingKrullDimAdicCompletionQuotientEq)
          source: >-
            The theory of local rings: Zariski–Samuel, Commutative Algebra II, Ch. VII–VIII;
            Nagata, Local Rings (Hironaka I, footnote 3, p. 116)
    - declaration: "Hironaka.MainTheorem.I_all"
