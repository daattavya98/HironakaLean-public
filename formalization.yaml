        - statement: >-
            A regular local ring is a unique factorization domain. (Hironaka.Cited.IsRegularLocalRingUniqueFactorizationMonoid)
          source: >-
            Auslander–Buchsbaum, Unique factorization in regular local rings (1959). Not stated in the paper; used for
            the equivalence of Definition 2 (Hironaka I, p. 141: “invertible (or, equivalently, E is everywhere of
            codimension one on X …)”), within the theory of local rings (Hironaka I, footnote 3, p. 116)
        - statement: >-
            (*) “Let f be a rational application of a non-singular algebraic B-scheme X to another algebraic B-scheme Y.
            We assume that f is proper. Then there exists a finite system of coherent sheaves of ideals ≠ (0), say J₁,
            J₂, …, J_d, on X, such that: If h: X′ → X is any morphism of a non-singular algebraic B-scheme X′ to X, and if we can write J′ᵢPᵢ = h⁻¹(Jᵢ) for each i where Pᵢ is an invertible sheaf of ideals on X′ and J′ᵢ is a sheaf of ideals ≠ (0) on X′ which is not divisible by any invertible sheaf of ideals (except O_X′), then the domain of definition of the composition f∘h is exactly equal to the set of those points x of X′ at which
            J′ᵢₓ = O_X′,x for at least one i.” (Hironaka I, p. 141)
            (Hironaka.Cited.RationalApplicationExistsFiniteSystemDomainPrecompEq)
          source: "Hironaka I, p. 141 (“we note the following fact”): stated without proof or reference; assumed, as in the paper"
        - statement: >-
            The single blow-up case of consequence (2), “the same result for a monoidal transformation of a non-singular
            algebraic B-scheme with non-singular center” (Hironaka I, p. 145): for the monoidal transformation f: X′ → X of a non-singular algebraic B-scheme X with
            non-singular center, nowhere dense in X, the direct images Rⁱf(O_X′) are zero for i > 0 and R⁰f(O_X′) is O_X.
            (Hironaka.Cited.MonoidalTransformationHigherDirectImageStructureSheaf)
          source: "Hironaka I, p. 145: stated without proof or reference; assumed, as in the paper"
        - statement: >-
            For (X₁, θ₁) ∈ 𝔐(L/B) with X₁ non-singular, there is (X₂, θ₂) ∈ 𝔐(L/B) “which dominates (X₁, θ₁) and of
            which X₂ is projective. The existence of such (X₂, θ₂) is obvious.” (Hironaka I, p. 145)
            (Hironaka.Cited.FunctionFieldPairExistsProjectiveDominating)
          source: "Hironaka I, p. 145 (“obvious”): stated without proof or reference; assumed, as in the paper"
        - statement: >-
            If (X′₁, θ′₁) is obtained from (X₁, θ₁) ∈ 𝔐(L/B), X₁ non-singular, by a finite succession of monoidal
            transformations with non-singular centers and dominates (X₂, θ₂), X₂ projective, which dominates (X₁, θ₁),
            then X′₁ is projective: “the algebraic B-scheme X′₁ obtained in (1) is then necessarily projective”
            (Hironaka I, p. 145). (Hironaka.Cited.FunctionFieldPairIsProjectiveOverOfIsObtainedByDominates)
          source: "Hironaka I, p. 145: stated without proof or reference; assumed, as in the paper"
