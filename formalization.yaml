    - declaration: "Hironaka.MainTheorem.Ch0.exists_isInvertible_subsheaf_pullback"
      comparator_config: "comparator-ch0.json"
      literature_dependencies: &HironakaCitedResultsCh0
        - *IsHironakaBaseIsClosedSingularLocus
        - *MonoidalTransformationExistsIsProper
        - *CurveFiniteIntegralClosure
        - *ExistsFlatIsLocalHomAdicCompletionOfFlat
        - *ExistsHilbertSamuelPoly
        - *ExistsResidueCompEqIdOfIsAdicCompleteOfRingCharEq
        - *ExistsSurjectiveMvPowerSeriesOfIsAdicComplete
        - *ExistsSurjectiveOfIsRegularLocalRingOfIsAdicComplete
