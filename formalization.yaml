automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5", "claude-sonnet-5-5", "claude-fable-5-1"]   # owners: confirm the full list
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (CLI and VS Code extension) orchestrating parallel sub-agents, one per Lean file or proof step;
        Lean 4 v4.35.0-rc3 with lake; LeanArchitect @[blueprint] annotations; scans and OCR of the paper for checking statements and quotations; a private record of every deviation, gap and error. Authors take responsibility for the fidelity of translation and the correctness of the Lean code.

fidelity:
  divergences: >-
    There are three errors that we deem non-trivial. Each of these has been repaired, and the theorems are formalized with their original printed statements after incorporating the corrections. These are: (1) Lemma (AB.4) and condition [g],
    Ch. IV §3, p. 299: the irreducibility of the center is false (explicit counterexample and discussion to appear in the erratum); herein the condition is imposed
    componentwise and the argument goes through. (2) The subschemes Ẽ_j of the auxiliary datum (Ch. IV, pp. 298, 308, 315, 321) can be reducible,
    and Ẽ_i = X̃ when F = E_i; they are split into connected components and Ẽ_j = X̃ is dropped. (3) J̄*(s) and
    Remark 2 of Ch. IV §4 (pp. 322–323) fail in the closed case with F = E_i, a_i > 0, ν < b (example in 𝔸³); the
    threshold b − ν is shifted by the weight of the dropped components. 
    Aside from trivial issues such as typos, there are a few other deviations. For instance, there are cases where a statement is false only in a degenerate case but the original arguments are formalizable with an additional hypothesis. Lemma 18 and Theorem 6 of Ch. III are representative examples. Every deviation is recorded in the docstring of the declaration concerned. A complete compilation of all deviations, gaps and errors will be available in the erratum.

